# scroller
scroller_structs=20
scroller_default_proportion=0.9
scroller_focus_center=0
scroller_prefer_center=0
scroller_prefer_overspread=1
edge_scroller_pointer_focus=1
scroller_ignore_proportion_single=0
scroller_proportion_preset=0.6,0.9,1.0

# master
new_is_master=0
default_master_factor=0.55
default_master_count=1
smart_gaps=1
center_master_overspread=1

# dwindle
dwindle_split_ratio=0.5
dwindle_horizontal_split=2

monocle_tab_mode=1
deck_tab_mode=1

# overview
overview_gap_inner=5
overview_gap_outer=30

# misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
sloppy_focus=0
warp_cursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=1
snap_distance=30
drag_tile_to_tile=1
drag_tile_small=1
allow_tearing=1
sync_obj_enable=1

#keyboard
repeat_rate=10
repeat_delay=250
xkb_rules_layout=us

# mouse
mouse_accel_profile=1
mouse_accel_speed=0.9
axis_scroll_factor=1.2
disable_trackpad=1

# tag rules
tag_rule=id:1,layout_name:tile
tag_rule=id:2,layout_name:tile
tag_rule=id:3,layout_name:vertical_scroller
tag_rule=id:4,layout_name:vertical_scroller
tag_rule=id:5,layout_name:scroller
tag_rule=id:6,layout_name:scroller
tag_rule=id:7,layout_name:center_tile
tag_rule=id:8,layout_name:center_tile
tag_rule=id:9,layout_name:dwindle


# layer rules

# msnap
layer_rule=layer_name:msnap, no_animation:1, no_blur:1

# screenshot
layer_rule=no_animation:1,no_blur:1,layer_name:selection

# rofi
layer_rule=animation_type_open:zoom, animation_type_close:zoom, no_animation:0, layer_name:rofi

# wswitch
layer_rule=animation_type_open:none, animation_type_close:none, no_animation:0, layer_name:wswitch

# display
monitor_rule=make:Microstep,model:MAG 271QPX E2,width:2560,height:1440,refresh:240,x:0,y:0

# autostart
exec_once=~/.config/mango/autostart.sh
exec_once=wswitch --daemon

source=./binds.conf
source=./visuals.conf
